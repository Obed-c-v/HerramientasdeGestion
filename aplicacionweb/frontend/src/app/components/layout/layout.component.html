<div class="dashboard-layout">
    <app-sidebar #sidebar></app-sidebar>

    <!-- Overlay for mobile sidebar -->
    @if (sidebar.isMobileOpen()) {
    <div class="sidebar-overlay" (click)="sidebar.toggleMobile()"></div>
    }

    <main class="main-container">
        <header class="top-header">
            <div class="header-left">
                <button class="hamburger-btn" (click)="toggleSidebar()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <h2 class="page-title">{{ settingsService.translate('portal_title') }}</h2>
            </div>
            <div class="header-tools">
                <div class="header-preferences">
                    <div class="lang-selector-mini">
                        <select [ngModel]="settingsService.language()" (change)="onLanguageChange($event)">
                            <option value="es">ES</option>
                            <option value="en">EN</option>
                        </select>
                    </div>
                    <label class="theme-toggle-compact" [title]="settingsService.translate('dark_mode')">
                        <input type="checkbox" [ngModel]="settingsService.darkMode()"
                            (change)="settingsService.toggleDarkMode()">
                        <div class="toggle-icon">
                            @if (settingsService.darkMode()) {
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
                            </svg>
                            } @else {
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <circle cx="12" cy="12" r="4" />
                                <path d="M12 2v2" />
                                <path d="M12 20v2" />
                                <path d="m4.93 4.93 1.41 1.41" />
                                <path d="m17.66 17.66 1.41 1.41" />
                                <path d="M2 12h2" />
                                <path d="M20 12h2" />
                                <path d="m6.34 17.66-1.41 1.41" />
                                <path d="m19.07 4.93-1.41 1.41" />
                            </svg>
                            }
                        </div>
                    </label>
                </div>

                <button class="notification-btn" [attr.aria-label]="settingsService.translate('alerts')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span class="notification-badge"></span>
                </button>
                <div class="user-profile" (click)="goToProfile()" style="cursor: pointer;">
                    @if (userAvatarUrl) {
                        <img [src]="userAvatarUrl" class="user-avatar" style="object-fit: cover;">
                    } @else {
                        <div class="user-avatar">{{ userInitials }}</div>
                    }
                    <span class="user-name">{{ userFullName }}</span>
                </div>
            </div>
        </header>

        <app-breadcrumb></app-breadcrumb>

        <div class="content-scroll" [@routeAnimations]="getRouteAnimationData()">
            <router-outlet />
        </div>
    </main>
</div>
