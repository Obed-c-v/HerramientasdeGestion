<nav class="breadcrumb-nav" aria-label="Breadcrumb" *ngIf="(breadcrumbs$ | async) as breadcrumbs">
    <ol class="breadcrumb-list">
        <li class="breadcrumb-item">
            <a routerLink="/dashboard" class="breadcrumb-link home-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </a>
        </li>
        <li class="breadcrumb-item" *ngFor="let breadcrumb of breadcrumbs; let last = last">
            <span class="separator">/</span>
            <a *ngIf="!last" [routerLink]="breadcrumb.url" class="breadcrumb-link">{{
                settingsService.translate(breadcrumb.label) }}</a>
            <span *ngIf="last" class="breadcrumb-current">{{ settingsService.translate(breadcrumb.label) }}</span>
        </li>
    </ol>
</nav>
